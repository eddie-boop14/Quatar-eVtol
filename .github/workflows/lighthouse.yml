name: lighthouse

# Score tracking, deliberately OUT of the deploy path.
#
# Lighthouse scores move a point or two between identical runs. Gating a deploy
# on them means a green build one hour and a red one the next with no code
# change -- which is how the deploy gate got wedged on 3 Aug 2026. So this runs
# weekly against production, records the numbers in the job summary, and fails
# only if a category falls through the FLOOR. The floor is an alarm, not a
# target. The target is 100 and lives in the run summary where a human reads it.
#
# Nothing here can block a deploy: Netlify does not consult GitHub Actions.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

env:
  SITE_URL: https://qatarevtol.com/
  FLOOR: '90'
  TARGET: '100'

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Lighthouse (mobile profile)
        run: |
          npx --yes lighthouse@12 "$SITE_URL" \
            --output=json --output-path=./lh.json \
            --chrome-flags="--headless=new --no-sandbox" \
            --quiet

      - name: Write report and check the floor
        run: node .github/lh-report.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lh.json
