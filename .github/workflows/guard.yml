name: guard

# The same guard.sh that Netlify runs as its build command, run here as well.
#
# Why both: Netlify's copy protects production — a bad commit cannot publish.
# This copy protects main — a bad commit shows a red check on the pull request
# before anyone merges it. One script, one source of truth, two places it bites.
#
# If this is red, do not merge. The failure message names the regression.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build-time invariants
        run: ./guard.sh
