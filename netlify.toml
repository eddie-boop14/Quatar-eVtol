# Continuous deployment config — Qatar eVTOL directory.
# This is a pre-generated static site: HTML lives at the repo root, no build step.
[functions]
  directory = "netlify/functions"

[build]
  publish = "."
  command = "./guard.sh"

# Nudge SEO/security headers (safe defaults for a static directory).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Inline <style>/<script> and style attributes are how these pages ship;
    # thumbnails are hotlinked from Unsplash (self-hosting them is a POA item).
    Content-Security-Policy = "default-src 'none'; img-src 'self' data: https://images.unsplash.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; manifest-src 'self'"

# Machine-readable surfaces are for other people's code: CORS-open, cached briefly.
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/entities.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/entities.csv"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Self-hosted variable fonts — stable filenames, bytes never change in place.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

