# Continuous deployment config — Qatar eVTOL directory.
# This is a pre-generated static site: HTML lives at the repo root, no build step.
[build]
  publish = "."
  command = "./guard.sh"

# Nudge SEO/security headers (safe defaults for a static directory).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Self-hosted variable fonts — stable filenames, bytes never change in place.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

